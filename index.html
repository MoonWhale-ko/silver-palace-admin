<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실버 스트림 · 편집</title><link rel="stylesheet" href="editor/editor.css"></head><body>
<button id="toggle" title="편집 모드 (Alt+E)">편집</button>
<header id="tools" hidden><strong>실버 스트림 편집</strong><button data-action="text">글자</button><button data-action="rect">사각형</button><button data-action="ellipse">원</button><button data-action="image">이미지</button><button data-action="undo">실행 취소</button><button data-action="redo">다시 실행</button><button data-action="export">파일 받기</button><button data-action="import">파일 열기</button><select id="viewport" aria-label="화면 너비"><option value="full">PC 화면</option><option value="390">모바일 390px</option><option value="768">태블릿 768px</option></select><button data-action="reset">처음 화면</button><button data-action="preview">미리보기</button></header>
<main id="stage"><iframe id="page" src="site.html" title="실버 스트림 사이트 화면"></iframe></main>
<aside id="panel" hidden><h2>선택한 요소</h2><p id="selection">화면에서 요소를 클릭하세요.</p><label>글자<textarea id="text" rows="3"></textarea></label><div class="pair"><label>글자색<input id="color" type="color" value="#564935"></label><label>배경색<input id="backgroundColor" type="color" value="#e7ddc7"></label></div><label>글자 크기<input id="fontSize" type="number" min="8" max="200" value="20"></label><label>글꼴<select id="fontFamily"><option value="inherit">기본 글꼴</option><option value="sans-serif">고딕</option><option value="serif">명조</option><option value="monospace">고정폭</option></select></label><label>글자 정렬<select id="textAlign"><option value="left">왼쪽</option><option value="center">가운데</option><option value="right">오른쪽</option></select></label><div class="pair"><label>X<input id="x" type="number"></label><label>Y<input id="y" type="number"></label><label>너비<input id="width" type="number" min="10"></label><label>높이<input id="height" type="number" min="10"></label></div><div class="pair"><label>테두리 두께<input id="borderWidth" type="number" min="0" max="30" value="0"></label><label>테두리 색<input id="borderColor" type="color" value="#564935"></label><label>모서리<input id="borderRadius" type="number" min="0" max="300" value="0"></label></div><p class="hint">추가한 요소는 드래그하여 이동합니다. 오른쪽 아래 손잡이를 드래그하면 크기가 바뀝니다.</p><div class="pair"><button data-action="duplicate">복제</button><button data-action="delete">삭제</button><button data-action="front">맨 앞으로</button><button data-action="back">맨 뒤로</button><button data-action="center">가운데 배치</button><button data-action="lock">잠금 전환</button></div><h2>추가한 요소</h2><div id="layers"></div><p class="hint">Alt+E 편집 전환<br>Alt+S 파일 받기<br>Ctrl+Z 실행 취소<br>Ctrl+Shift+Z 다시 실행<br>방향키 이동 · Shift로 10px<br>Delete 추가 요소 삭제<br>글자 두 번 클릭: 직접 수정</p></aside>
<output id="status" role="status" aria-live="polite">준비 중</output><input id="imagefile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden><input id="projectfile" type="file" accept=".zip" hidden><script type="module" src="editor/editor.js"></script></body></html>
